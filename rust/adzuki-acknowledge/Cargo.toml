[package]
name = "adzuki-acknowledge"
version = "0.1.0"
edition = "2024"
# Required by rustleger dependencies.
license = "GPL-3.0-only"

[[bin]]
name = "adzuki-acknowledge"
path = "src/bin/adzuki-acknowledge.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
ratatui-interact = { version = "0.5.3", features = ["clipboard"] }
rustledger-loader = "0.24.0"
rustledger-query = "0.24.0"
